spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sebisprojectsdb
    username: sebi
    password: sebisProjectsPass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 8080
